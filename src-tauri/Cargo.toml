[package]
name = "cat_library"
version = "0.1.0"
description = "ZeroCat local media index desktop shell"
authors = ["ZeroCat"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cat_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-dialog = "2"
winapi = { version = "0.3", features = ["winuser", "wingdi", "windef", "winbase"] }
flate2 = "1.0"
# 列表卡片缩略图：只需常见图片格式的解码 + jpeg/png 编码
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
