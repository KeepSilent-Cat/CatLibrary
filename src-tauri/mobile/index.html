<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#141018" />
    <title>CatLibrary · 手机浏览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141018;
        --panel: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f3f0f7;
        --muted: rgba(243, 240, 247, 0.52);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        padding-bottom: env(safe-area-inset-bottom);
      }
      header {
        position: sticky; top: 0; z-index: 20;
        padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
        background: linear-gradient(180deg, rgba(20, 16, 24, 0.98), rgba(20, 16, 24, 0.72));
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .brand { font-size: 13px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
      .count { margin-left: auto; font-size: 12px; color: var(--muted); }
      .search {
        margin-top: 10px; display: flex; align-items: center; gap: 8px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
      }
      .search input {
        flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
        color: var(--text); font-size: 15px;
      }
      .search input::placeholder { color: rgba(243, 240, 247, 0.3); }
      .chips { margin-top: 8px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
      .chips button {
        flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; font-size: 12px;
        background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      }
      .chips button.on { background: rgba(143, 208, 255, 0.2); border-color: rgba(143, 208, 255, 0.5); color: #eaf6ff; }
      #grid {
        display: grid; gap: 10px; padding: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      @media (min-width: 560px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 820px) { #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .card {
        position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
        background: #1c1722; aspect-ratio: 3 / 4;
      }
      .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .meta {
        position: absolute; inset: auto 0 0 0; padding: 8px 9px;
        background: linear-gradient(180deg, transparent, rgba(10, 8, 14, 0.92));
      }
      .card .title {
        font-size: 12px; line-height: 1.35; font-weight: 600;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .card .sub { margin-top: 3px; font-size: 10px; color: var(--muted); display: flex; gap: 6px; }
      .badge {
        position: absolute; top: 7px; left: 7px; font-size: 10px; font-weight: 700;
        padding: 2px 6px; border-radius: 999px; border: 1px solid rgba(255, 140, 170, 0.5);
        background: rgba(70, 12, 30, 0.75); color: #ffc9d8;
      }
      .badge.r15 { border-color: rgba(255, 208, 140, 0.5); background: rgba(70, 52, 12, 0.75); color: #ffe1a8; }
      .kindtag {
        position: absolute; top: 7px; right: 7px; font-size: 10px; padding: 2px 6px; border-radius: 999px;
        border: 1px solid var(--line); background: rgba(10, 8, 14, 0.7); color: var(--muted);
      }
      .play {
        position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px;
        color: rgba(255, 255, 255, 0.85); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      }
      /* 查看器 */
      #viewer { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: rgba(8, 6, 12, 0.98); }
      #viewer.on { display: flex; }
      .vbar {
        display: flex; align-items: center; gap: 8px;
        padding: calc(env(safe-area-inset-top) + 10px) 14px 8px;
      }
      .vbar button {
        border: 1px solid var(--line); background: var(--panel); color: var(--text);
        border-radius: 999px; padding: 6px 12px; font-size: 13px;
      }
      .vbar button.on { background: rgba(143, 208, 255, 0.22); border-color: rgba(143, 208, 255, 0.5); }
      .vbar .vt { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 10px 14px; overflow: auto; }
      #stage img, #stage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
      .vnav { display: flex; gap: 10px; padding: 0 14px calc(env(safe-area-inset-bottom) + 14px); }
      .vnav button {
        flex: 1; padding: 12px; border-radius: 12px; font-size: 14px;
        border: 1px solid var(--line); background: var(--panel); color: var(--text);
      }
      .vnav button:disabled { opacity: 0.35; }
      /* 滚动阅读 */
      .scrollwrap { width: 100%; padding: 0 8px 30px; display: flex; flex-direction: column; gap: 6px; }
      .scrollwrap img { width: 100%; height: auto; border-radius: 4px; }
      /* 小说 */
      .novel { padding: 18px 20px 40px; max-width: 720px; margin: 0 auto; }
      .novel h2 { font-size: 16px; margin: 0 0 12px; color: #dbeafe; }
      .novel p { font-size: 15px; line-height: 1.95; margin: 0 0 14px; color: #e6e2ee; white-space: pre-wrap; }
      .novelbar { display: flex; gap: 8px; padding: 8px 16px; }
      .novelbar select {
        flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line);
        color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 13px;
      }
      /* 报道 */
      .report { padding: 18px 18px 48px; max-width: 760px; margin: 0 auto; }
      .report h1 { font-size: 20px; line-height: 1.45; margin: 0 0 14px; }
      .report h2 { font-size: 16px; margin: 22px 0 10px; color: #dbeafe; }
      .report p { font-size: 15px; line-height: 1.9; margin: 0 0 14px; color: #e6e2ee; white-space: pre-wrap; }
      .report blockquote { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid rgba(143, 208, 255, 0.5); color: var(--muted); font-size: 13px; }
      .report img, .report video { width: 100%; height: auto; border-radius: 10px; margin: 0 0 14px; display: block; }
      .report hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
      .empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }
      .loadmore { padding: 18px; text-align: center; }
      .loadmore button { padding: 10px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <span class="brand">CatLibrary</span>
        <span class="count" id="count">连接中…</span>
      </div>
      <div class="search">
        <span style="opacity: 0.4">🔍</span>
        <input id="q" type="search" placeholder="搜索标题或标签" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
    </header>

    <main id="grid"></main>
    <div class="loadmore" id="loadmore" hidden><button id="more">显示更多</button></div>

    <div id="viewer">
      <div class="vbar">
        <button id="close">返回</button>
        <span class="vt" id="vtitle"></span>
        <button id="modeToggle" hidden>滚动</button>
        <span class="vt" id="vpos" style="flex: 0 0 auto; text-align: right"></span>
      </div>
      <div id="novelbar" class="novelbar" hidden><select id="chapterSelect"></select></div>
      <div id="stage"></div>
      <div class="vnav" id="pager">
        <button id="prev">上一张</button>
        <button id="next">下一张</button>
      </div>
    </div>

    <script>
      (function () {
        var token = '';
        var params = new URLSearchParams(location.search);
        if (params.get('t')) {
          token = params.get('t');
          try { localStorage.setItem('catlib-token', token); } catch (e) {}
          history.replaceState(null, '', location.pathname);
        } else {
          try { token = localStorage.getItem('catlib-token') || ''; } catch (e) {}
        }

        var items = [], filtered = [], shown = 0, PAGE = 40;
        var category = 'all', keyword = '';
        var grid = document.getElementById('grid');
        var countEl = document.getElementById('count');
        var chipsEl = document.getElementById('chips');
        var loadmore = document.getElementById('loadmore');
        var moreBtn = document.getElementById('more');

        function q(url) { return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(token); }
        function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

        var KIND_LABEL = {
          images: '图片', videos: '视频', comics: '漫画', novels: '小说',
          reports: '报道', screenshots: '截图',
        };

        function applyFilter() {
          var word = keyword.trim().toLowerCase();
          filtered = items.filter(function (item) {
            if (category !== 'all' && item.category !== category) return false;
            if (!word) return true;
            return (item.title + ' ' + (item.tags || []).join(' ')).toLowerCase().indexOf(word) >= 0;
          });
          shown = 0; grid.innerHTML = ''; render();
        }

        function coverOf(item) {
          if (item.category === 'reports' && item.coverUrl) return q(item.coverUrl);
          return q('/api/cover?c=' + item.category + '&id=' + encodeURIComponent(item.id));
        }

        function render() {
          var slice = filtered.slice(shown, shown + PAGE);
          slice.forEach(function (item) {
            var card = document.createElement('a');
            card.className = 'card';
            card.href = 'javascript:void 0';
            var img = document.createElement('img');
            img.loading = 'lazy';
            img.src = coverOf(item);
            img.alt = item.title;
            img.onerror = function () { img.style.display = 'none'; };
            card.appendChild(img);
            if (item.rating > 0) {
              var badge = document.createElement('span');
              badge.className = 'badge' + (item.rating === 1 ? ' r15' : '');
              badge.textContent = item.rating === 2 ? '18+' : 'R15';
              card.appendChild(badge);
            }
            var kind = document.createElement('span');
            kind.className = 'kindtag';
            kind.textContent = KIND_LABEL[item.category] || item.category;
            card.appendChild(kind);
            if (item.hasVideo) {
              var play = document.createElement('span');
              play.className = 'play';
              play.textContent = '▶';
              card.appendChild(play);
            }
            var meta = document.createElement('div');
            meta.className = 'meta';
            var title = document.createElement('div');
            title.className = 'title';
            title.textContent = item.title;
            var sub = document.createElement('div');
            sub.className = 'sub';
            var unit = item.category === 'comics' || item.category === 'novels' ? ' 章/页' : ' 项';
            sub.textContent = item.count + unit;
            meta.appendChild(title);
            meta.appendChild(sub);
            card.appendChild(meta);
            card.addEventListener('click', function () { openItem(item); });
            grid.appendChild(card);
          });
          shown += slice.length;
          loadmore.hidden = shown >= filtered.length;
          countEl.textContent = filtered.length + ' 项';
        }

        moreBtn.addEventListener('click', render);

        /* ------- 查看器 ------- */
        var viewer = document.getElementById('viewer');
        var stage = document.getElementById('stage');
        var vtitle = document.getElementById('vtitle');
        var vpos = document.getElementById('vpos');
        var pager = document.getElementById('pager');
        var prevBtn = document.getElementById('prev');
        var nextBtn = document.getElementById('next');
        var modeToggle = document.getElementById('modeToggle');
        var novelbar = document.getElementById('novelbar');
        var chapterSelect = document.getElementById('chapterSelect');
        var files = [], cursor = 0, current = null, scrollMode = false;

        function resetViewer() {
          stage.innerHTML = '';
          stage.style.display = 'grid';
          pager.hidden = true;
          novelbar.hidden = true;
          modeToggle.hidden = true;
          vpos.textContent = '';
          scrollMode = false;
          modeToggle.textContent = '滚动';
          modeToggle.className = '';
        }

        function openItem(item) {
          current = item;
          vtitle.textContent = item.title;
          viewer.classList.add('on');
          resetViewer();
          if (item.category === 'reports') return openReport(item);
          if (item.category === 'novels') return openNovel(item);
          if (item.category === 'comics') {
            modeToggle.hidden = false;
            modeToggle.onclick = function () {
              scrollMode = !scrollMode;
              modeToggle.textContent = scrollMode ? '翻页' : '滚动';
              modeToggle.className = scrollMode ? 'on' : '';
              if (scrollMode) renderComicScroll(); else showFile();
            };
          }
          fetch(q('/api/list?c=' + item.category + '&id=' + encodeURIComponent(item.id)))
            .then(function (res) { return res.json(); })
            .then(function (list) {
              files = list; cursor = 0;
              if (scrollMode) renderComicScroll(); else showFile();
            })
            .catch(function () { stage.innerHTML = '<div class="empty">读取失败</div>'; });
        }

        function showFile() {
          stage.style.display = 'grid';
          pager.hidden = false;
          if (!files.length) { stage.innerHTML = '<div class="empty">这个合集还没有可读文件</div>'; return; }
          var file = files[cursor];
          var url = q('/media?c=' + current.category + '&id=' + encodeURIComponent(current.id) + '&n=' + file.index);
          stage.innerHTML = '';
          var node;
          if (file.isVideo) {
            node = document.createElement('video');
            node.controls = true; node.playsInline = true; node.preload = 'metadata'; node.src = url;
          } else {
            node = document.createElement('img'); node.src = url; node.alt = file.name;
          }
          stage.appendChild(node);
          vpos.textContent = (cursor + 1) + ' / ' + files.length;
          prevBtn.disabled = cursor <= 0;
          nextBtn.disabled = cursor >= files.length - 1;
        }

        function renderComicScroll() {
          pager.hidden = true;
          stage.style.display = 'block';
          stage.innerHTML = '';
          var wrap = document.createElement('div');
          wrap.className = 'scrollwrap';
          files.forEach(function (file) {
            if (file.isVideo) {
              var video = document.createElement('video');
              video.controls = true; video.playsInline = true; video.preload = 'none';
              video.src = q('/media?c=comics&id=' + encodeURIComponent(current.id) + '&n=' + file.index);
              wrap.appendChild(video);
            } else {
              var img = document.createElement('img');
              img.loading = 'lazy';
              img.src = q('/media?c=comics&id=' + encodeURIComponent(current.id) + '&n=' + file.index);
              wrap.appendChild(img);
            }
          });
          stage.appendChild(wrap);
          vpos.textContent = files.length + ' 页';
        }

        prevBtn.addEventListener('click', function () { if (cursor > 0) { cursor -= 1; showFile(); } });
        nextBtn.addEventListener('click', function () { if (cursor < files.length - 1) { cursor += 1; showFile(); } });
        document.getElementById('close').addEventListener('click', function () {
          viewer.classList.remove('on');
          stage.innerHTML = '';
        });

        /* ------- 报道 ------- */
        function openReport(item) {
          stage.style.display = 'block';
          stage.innerHTML = '<div class="empty">正在加载报道…</div>';
          fetch(q('/api/report?id=' + encodeURIComponent(item.id)))
            .then(function (res) { return res.json(); })
            .then(function (data) {
              var article = document.createElement('article');
              article.className = 'report';
              (data.blocks || []).forEach(function (block) {
                var node;
                if (block.type === 'h1') { node = document.createElement('h1'); node.textContent = block.text; }
                else if (block.type === 'h2') { node = document.createElement('h2'); node.textContent = block.text; }
                else if (block.type === 'quote') { node = document.createElement('blockquote'); node.textContent = block.text; }
                else if (block.type === 'divider') { node = document.createElement('hr'); }
                else if (block.type === 'image' && block.url) {
                  node = document.createElement('img'); node.loading = 'lazy'; node.src = q(block.url);
                } else if (block.type === 'video' && block.url) {
                  node = document.createElement('video'); node.controls = true; node.playsInline = true;
                  node.preload = 'metadata'; node.src = q(block.url);
                } else if (block.type === 'audio' && block.url) {
                  node = document.createElement('audio'); node.controls = true; node.src = q(block.url);
                } else {
                  node = document.createElement('p'); node.textContent = block.text || '';
                }
                article.appendChild(node);
                if (block.caption) {
                  var cap = document.createElement('p');
                  cap.style.fontSize = '12px'; cap.style.color = 'rgba(243,240,247,0.45)';
                  cap.textContent = block.caption;
                  article.appendChild(cap);
                }
              });
              stage.innerHTML = '';
              stage.appendChild(article);
              vpos.textContent = (data.blocks || []).length + ' 块';
            })
            .catch(function () { stage.innerHTML = '<div class="empty">报道读取失败</div>'; });
        }

        /* ------- 小说 ------- */
        function openNovel(item) {
          stage.style.display = 'block';
          novelbar.hidden = false;
          stage.innerHTML = '<div class="empty">正在加载目录…</div>';
          fetch(q('/api/list?c=novels&id=' + encodeURIComponent(item.id)))
            .then(function (res) { return res.json(); })
            .then(function (list) {
              chapterSelect.innerHTML = '';
              list.forEach(function (file) {
                var option = document.createElement('option');
                option.value = String(file.index);
                option.textContent = file.name;
                chapterSelect.appendChild(option);
              });
              chapterSelect.onchange = function () { loadChapter(current.id, Number(chapterSelect.value)); };
              if (!list.length) { stage.innerHTML = '<div class="empty">这本小说还没有章节</div>'; return; }
              loadChapter(current.id, 0);
            })
            .catch(function () { stage.innerHTML = '<div class="empty">目录读取失败</div>'; });
        }

        function loadChapter(id, index) {
          stage.innerHTML = '<div class="empty">正在读取正文…</div>';
          fetch(q('/api/novel?c=novels&id=' + encodeURIComponent(id) + '&n=' + index))
            .then(function (res) { return res.json(); })
            .then(function (data) {
              var article = document.createElement('article');
              article.className = 'novel';
              var heading = document.createElement('h2');
              heading.textContent = data.name || '正文';
              article.appendChild(heading);
              var paragraphs = String(data.text || '').split(/\n{1,}/);
              paragraphs.forEach(function (line) {
                if (!line.trim()) return;
                var p = document.createElement('p');
                p.textContent = line;
                article.appendChild(p);
              });
              stage.innerHTML = '';
              stage.appendChild(article);
              stage.scrollTop = 0;
            })
            .catch(function () { stage.innerHTML = '<div class="empty">章节读取失败</div>'; });
        }

        /* ------- 初始化 ------- */
        var cats = [
          { key: 'all', label: '全部' },
          { key: 'images', label: '图片' },
          { key: 'videos', label: '视频' },
          { key: 'comics', label: '漫画' },
          { key: 'novels', label: '小说' },
          { key: 'reports', label: '报道' },
          { key: 'screenshots', label: '截图' },
        ];
        cats.forEach(function (cat) {
          var button = document.createElement('button');
          button.textContent = cat.label;
          if (cat.key === 'all') button.className = 'on';
          button.addEventListener('click', function () {
            category = cat.key;
            Array.prototype.forEach.call(chipsEl.children, function (node) { node.className = ''; });
            button.className = 'on';
            applyFilter();
          });
          chipsEl.appendChild(button);
        });

        document.getElementById('q').addEventListener('input', function (event) {
          keyword = event.target.value;
          applyFilter();
        });

        if (!token) {
          grid.innerHTML = '<div class="empty">缺少访问令牌。<br>请在电脑端「设置 → 手机访问」重新启动，再扫同一个地址。</div>';
          countEl.textContent = '';
          return;
        }

        fetch(q('/api/index'))
          .then(function (res) {
            if (res.status === 401) throw new Error('token');
            return res.json();
          })
          .then(function (list) { items = list; applyFilter(); })
          .catch(function (error) {
            grid.innerHTML = '<div class="empty">' +
              (error && error.message === 'token'
                ? '访问令牌已失效，请在电脑端重新启动手机访问。'
                : '连接失败，确认手机和电脑在同一个 WiFi，且电脑上的手机访问已开启。') +
              '</div>';
            countEl.textContent = '';
          });
      })();
    </script>
  </body>
</html>
